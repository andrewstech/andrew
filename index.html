<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Portfolio site — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#e5e7eb;font-family:Inter,system-ui,sans-serif}
  .sb-stage{display:flex;justify-content:center;min-height:100vh}
  .sb-page{position:relative;background:#0f172a;box-shadow:0 10px 40px rgba(0,0,0,.12);transform-origin:top center}
  .sb-nav{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;padding:0 32px;font-weight:600;font-size:15px;z-index:9999;pointer-events:auto}
  .sb-nav a{transition:opacity .15s ease}
  .sb-nav a:hover{opacity:1!important}
</style>
</head>
<body>
<div class="sb-stage">
  <div class="sb-page" style="width:1200px;height:900px">
    <div class="sb-nav"><a href="index.html" style="margin-right:20px;color:inherit;text-decoration:none;opacity:.7">Home</a></div>
    <div style="position: absolute; left: 80px; top: 120px; width: 700px; height: 120px; overflow: hidden; opacity: 1; transform-origin: center; display: flex; flex-direction: column; justify-content: flex-start; color: #ffffff; font-size: 72px; font-weight: 800; text-align: left; font-family: Inter, system-ui, sans-serif; line-height: 1.1"><div style="white-space:pre-wrap;word-break:break-word;width:100%">Hello, I&#39;m Andy</div></div>
<div style="position: absolute; left: 80px; top: 250px; width: 560px; height: 80px; overflow: hidden; opacity: 1; transform-origin: center; display: flex; flex-direction: column; justify-content: flex-start; color: #94a3b8; font-size: 20px; font-weight: 400; text-align: left; font-family: Inter, system-ui, sans-serif; line-height: 1.5"><div style="white-space:pre-wrap;word-break:break-word;width:100%">A product designer crafting thoughtful, usable interfaces.</div></div>
<a href="#" style="position: absolute; left: 80px; top: 360px; width: 180px; height: 54px; overflow: hidden; opacity: 1; transform-origin: center; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #0f172a; background-color: #ffffff; border-radius: 12px; font-size: 15px; font-weight: 600; font-family: Inter, system-ui, sans-serif; text-align: center">View work</a>
<div style="position: absolute; left: 720px; top: 120px; width: 400px; height: 520px; overflow: hidden; opacity: 1; transform-origin: center"><img src="https://images.unsplash.com/photo-1507003211169-0d1ef7d67b5b?w=800&amp;q=80" alt="Portrait" style="width: 100%; height: 100%; object-fit: cover; border-radius: 24px"/></div>
  </div>
</div>
<script>
(function(){
  var page=document.querySelector('.sb-page');
  var stage=document.querySelector('.sb-stage');
  function fit(){
    var s=Math.min(1, window.innerWidth/page.offsetWidth);
    page.style.transform='scale('+s+')';
    stage.style.height=(page.offsetHeight*s)+'px';
  }
  window.addEventListener('resize',fit);fit();
})();
</script>
</body>
</html>
