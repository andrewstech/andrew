<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Product landing site — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#e5e7eb;font-family:Inter,system-ui,sans-serif}
  .sb-stage{display:flex;justify-content:center;min-height:100vh}
  .sb-page{position:relative;background:#f8fafc;box-shadow:0 10px 40px rgba(0,0,0,.12);transform-origin:top center}
  .sb-nav{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;padding:0 32px;font-weight:600;font-size:15px;z-index:9999;pointer-events:none}
</style>
</head>
<body>
<div class="sb-stage">
  <div class="sb-page" style="width:1200px;height:900px">
    <div class="sb-nav"><a href="index.html" style="margin-right:20px;color:inherit;text-decoration:none;opacity:.7">Home</a></div>
    <div style="position: absolute; left: -59px; top: 181px; width: 900px; height: 120px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; color: #0f172a; font-size: 64px; font-weight: 800; text-align: center; font-family: Inter, system-ui, sans-serif; line-height: 1.1"><div style="white-space:pre-wrap;word-break:break-word;width:100%">Build something people love</div></div>
<div style="position: absolute; left: 280px; top: 320px; width: 600px; height: 60px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; color: #475569; font-size: 20px; font-weight: 400; text-align: center; font-family: Inter, system-ui, sans-serif; line-height: 1.5"><div style="white-space:pre-wrap;word-break:break-word;width:100%">The fastest way to ship a beautiful site.</div></div>
<a href="#" style="position: absolute; left: 510px; top: 420px; width: 180px; height: 54px; overflow: hidden; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #ffffff; background-color: #2563eb; border-radius: 12px; font-size: 15px; font-weight: 600; font-family: Inter, system-ui, sans-serif">Get started</a>
<div style="position: absolute; left: 280px; top: 540px; width: 640px; height: 220px; overflow: hidden; background-color: #e2e8f0; border-radius: 24px"></div>
  </div>
</div>
<script>
(function(){
  var page=document.querySelector('.sb-page');
  var stage=document.querySelector('.sb-stage');
  function fit(){
    var s=Math.min(1, window.innerWidth/page.offsetWidth);
    page.style.transform='scale('+s+')';
    stage.style.height=(page.offsetHeight*s)+'px';
  }
  window.addEventListener('resize',fit);fit();
})();
</script>
</body>
</html>
